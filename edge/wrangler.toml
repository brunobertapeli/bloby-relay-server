name = "morphy-edge"
main = "src/index.js"
compatibility_date = "2026-06-01"

# Deployed with NO zone routes by default: the worker is reachable only on its
# workers.dev URL (admin/debug) and is a complete no-op for production traffic.
# Rollout is per-handle first, wildcard last — see README.md.
workers_dev = true

# ── Rollout routes ───────────────────────────────────────────────────────────
# ⚠️ Keep this ABOVE [vars] — top-level TOML keys placed after a table header get
# swallowed into that table (routes-as-a-var creates NO zone route, silently).
#
# Self-hosted bots live ONLY under *.open.morphyagent.com (quick tunnel). Managed
# bots are first-level <handle>.morphyagent.com (direct EC2 A-records) and are
# deliberately NOT routed here — the worker never touches that namespace, so the
# managed tier's direct path is untouched. Requires the *.open Advanced Cert
# (ordered) and the *.open.morphyagent.com wildcard record set to Proxied.
routes = [
  { pattern = "*.open.morphyagent.com/*", zone_name = "morphyagent.com" },
]
# NOTE: additive — an .open host with no quick route in its DO (offline / never
# connected / unknown handle) is passed through to origin (Railway) unchanged,
# which serves its own offline/404 pages. The worker never replaces Railway.

[[durable_objects.bindings]]
name = "BOT_DO"
class_name = "BotDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BotDO"]

[vars]
RELAY_DOMAIN = "morphyagent.com"
# Secrets (set with `wrangler secret put <NAME>`):
#   EDGE_ADMIN_SECRET — shared secret for /__edge/* admin calls from the Railway relay

