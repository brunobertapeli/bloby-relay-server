#cloud-config
# Bloby managed-instance provisioning trigger.
# Bake to: /etc/cloud/cloud.cfg.d/99-bloby.cfg
#
# runcmd runs once per instance (not per boot), so provision.sh executes exactly
# once on a freshly launched box, reading its identity from EC2 user-data.
runcmd:
  - [ bash, /home/ec2-user/provision.sh ]
